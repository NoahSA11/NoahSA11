name: Shvil — checks and deploy

on:
  push:
    branches: [main]
    paths: ['shvil/**', '.github/workflows/shvil.yml']
  pull_request:
    paths: ['shvil/**', '.github/workflows/shvil.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: shvil

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shvil/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run content
      - run: npm test
      - name: Audit every question against the raw Sefaria snapshots
        run: npm run audit
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: shvil/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
